<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>拼音数学奖励小游戏</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root{
      --bg1:#ffe4e1; --bg2:#fff0f5; --card:#ffffff;
      --pink:#ffb6c1; --blue:#87cefa; --green:#98fb98; --red:#ffa07a;
      --text:#555; --sub:#888; --gold:#ffd700;
      --shadow:0 8px 20px rgba(255,182,193,.28);

      --card-w:128px; --card-h:168px; --card-font:84px;
      --math-card-h:120px; --math-font:40px;
      --voice-size:70px; --judge-w:92px; --judge-h:58px; --judge-font:24px;
      --key-h:52px; --key-font:24px;
      --badge-font:13px; --panel-pad:8px; --header-pad:10px 14px;
      --app-gap:8px; --card-gap:14px;
    }

    *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-touch-callout:none; font-family:'Comic Sans MS','Nunito',sans-serif; }
    html,body{ width:100%; height:100%; overflow:hidden; }
    body{ background:linear-gradient(135deg,var(--bg1),var(--bg2)); color:var(--text); }

    .app{ width:100%; max-width:600px; margin:0 auto; min-height:100dvh; height:100dvh; display:flex; flex-direction:column; align-items:center; padding:10px; gap:var(--app-gap); overflow:auto; }

    /* 顶部状态栏 */
    .header-bar{ width:100%; background:var(--card); border-radius:22px; border:3px solid #fff; box-shadow:var(--shadow); padding:var(--header-pad); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; position:relative; }
    .score-board,.timer-board{ display:flex; flex-direction:column; align-items:center; min-width:88px; }
    .board-title{ font-size:12px; color:var(--sub); font-weight:700; line-height:1.1; }
    .board-value{ font-size:clamp(18px,3.8vw,26px); font-weight:900; color:var(--blue); text-shadow:1px 1px 0 #fff; line-height:1.2; }
    .timer-controls button{ width:40px; height:40px; border:none; border-radius:50%; background:var(--pink); color:#fff; font-size:18px; box-shadow:0 4px 10px rgba(255,182,193,.45); cursor:pointer; }
    .timer-controls button:active{ transform:scale(.92); }

    /* 称号展示 */
    .title-badge { position:absolute; top:-12px; left:50%; transform:translateX(-50%); background:var(--gold); color:#fff; padding:4px 16px; border-radius:12px; font-size:12px; font-weight:bold; box-shadow:0 4px 8px rgba(255,215,0,.4); white-space:nowrap; border:2px solid #fff; transition:0.3s; }

    /* 模式切换 */
    .mode-switcher{ width:100%; display:flex; gap:8px; flex-shrink:0; }
    .mode-btn{ flex:1; border:none; border-radius:16px; padding:10px 8px; background:rgba(255,255,255,.55); color:var(--sub); font-size:15px; font-weight:800; border:2px solid #fff; cursor:pointer; transition:.2s; }
    .mode-btn.active{ background:var(--pink); color:#fff; box-shadow:0 4px 10px rgba(255,182,193,.35); }

    /* 设置面板 */
    .settings-panel{ width:100%; background:rgba(255,255,255,.6); border-radius:16px; padding:var(--panel-pad) 10px; flex-shrink:0; }
    .settings-title{ font-size:12px; color:var(--sub); font-weight:800; text-align:center; margin-bottom:6px; }
    .settings-group{ display:flex; flex-wrap:wrap; justify-content:center; gap:8px 12px; }
    .settings-group + .settings-group{ margin-top:8px; padding-top:8px; border-top:1px dashed #ddd; }
    .checkbox-label{ display:flex; align-items:center; gap:4px; font-size:14px; font-weight:700; color:var(--text); cursor:pointer; white-space:nowrap; }
    .checkbox-label input{ width:16px; height:16px; accent-color:var(--pink); }

    /* 拼音折叠组 */
    details { width: 100%; text-align: center; margin-top: 5px; }
    summary { font-size: 13px; font-weight: bold; color: var(--pink); cursor: pointer; outline: none; margin-bottom: 5px; }

    /* 展示区 */
    .display-container{ width:100%; flex:1; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:8px; }
    #libInfo{ font-size:12px; color:var(--sub); font-weight:700; flex-shrink:0; line-height:1.3; text-align:center; min-height:32px; display:flex; align-items:center; justify-content:center; padding:0 6px; }

    .main-card-area{ width:100%; position:relative; display:flex; justify-content:center; align-items:center; padding-top:18px; flex-shrink:0; }
    .difficulty-badge{ position:absolute; top:0; left:50%; transform:translateX(-50%); background:var(--pink); color:#fff; border-radius:16px; padding:5px 16px; font-size:var(--badge-font); font-weight:800; z-index:5; box-shadow:0 4px 8px rgba(255,182,193,.28); white-space:nowrap; }

    /* 拼音卡片 */
    #pinyinCards{ display:flex; gap:var(--card-gap); justify-content:center; align-items:center; width:100%; }
    .pinyin-card{ width:var(--card-w); height:var(--card-h); border-radius:20px; background:var(--card); border:4px solid #fff; box-shadow:0 10px 25px rgba(0,0,0,.05); display:flex; justify-content:center; align-items:center; font-size:var(--card-font); font-weight:900; color:var(--text); white-space:nowrap; overflow:hidden; transition:.3s; position:relative; cursor:pointer; }
    .pinyin-card:active{ transform:scale(.97); }
    .pinyin-card.single{ width:var(--card-w); height:var(--card-h); font-size:var(--card-font); }
    .pinyin-card.hidden{ display:none !important; }

    /* 数学卡片 (同行显示) */
    .math-card{ width:min(100%,460px); min-height:var(--math-card-h); border-radius:22px; background:var(--card); border:4px solid #fff; box-shadow:0 10px 25px rgba(0,0,0,.05); padding:10px 15px; display:flex; justify-content:center; align-items:center; text-align:center; transition:.3s; position:relative; }
    .math-formula{ font-size:var(--math-font); font-weight:900; line-height:1.2; display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; }
    .math-answer-box{ min-width:60px; height:clamp(36px,6vw,48px); border-bottom:4px dashed var(--pink); color:var(--blue); font-size:clamp(28px,6vw,42px); font-weight:900; display:flex; align-items:flex-end; justify-content:center; padding:0 5px; }

    /* 难度样式 */
    .diff-1{ animation:float 3s ease-in-out infinite; }
    .diff-2{ background:#fff9e6; border:4px dashed #ffb6c1; color:#ff69b4; animation:swing 4s ease-in-out infinite; transform-origin:top center; }
    .diff-3{ background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(224,247,250,.95)); border:3px solid rgba(255,255,255,.95); color:#1e90ff; box-shadow:0 8px 22px rgba(135,206,250,.38); animation:float 3s ease-in-out infinite; position:relative; overflow:hidden; }
    .diff-3::after{ content:""; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:linear-gradient(45deg,transparent 40%,rgba(255,255,255,.75) 50%,transparent 60%); animation:shimmer 2.6s linear infinite; pointer-events:none; }

    @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }
    @keyframes swing{ 0%,100%{ transform:rotate(-2deg); } 50%{ transform:rotate(2deg); } }
    @keyframes shimmer{ 0%{ transform:translate(-50%,-50%); } 100%{ transform:translate(50%,50%); } }

    /* 操作区 */
    #pinyinActionArea, #mathInputArea{ width:100%; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:8px; flex:1; min-height:0; }
    .pinyin-tool-row{ display:flex; align-items:center; justify-content:center; gap:14px; width:100%; }
    .voice-btn, .speak-btn{ width:var(--voice-size); height:var(--voice-size); border:none; border-radius:50%; color:#fff; font-size:28px; box-shadow:0 8px 20px rgba(135,206,250,.55); display:flex; justify-content:center; align-items:center; cursor:pointer; flex-shrink:0; }
    .voice-btn{ background:linear-gradient(135deg,var(--blue),#1e90ff); }
    .speak-btn{ background:linear-gradient(135deg,#ffd36e,#ffb347); box-shadow:0 8px 20px rgba(255,179,71,.45); }
    .voice-btn.recording{ background:linear-gradient(135deg,var(--red),#ff6347); animation:pulse 1s infinite; }
    .speak-btn.playing{ animation:speakerPulse .9s infinite; }

    @keyframes pulse{ 0%{ transform:scale(1); box-shadow:0 0 0 0 rgba(255,99,71,.55); } 70%{ transform:scale(1.08); box-shadow:0 0 0 16px rgba(255,99,71,0); } 100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(255,99,71,0); } }
    @keyframes speakerPulse{ 0%{ transform:scale(1); } 50%{ transform:scale(1.08); } 100%{ transform:scale(1); } }

    .judge-btns{ width:100%; display:flex; justify-content:center; gap:22px; flex-shrink:0; }
    .judge-btn{ width:var(--judge-w); height:var(--judge-h); border:none; border-radius:30px; color:#fff; font-size:var(--judge-font); display:flex; justify-content:center; align-items:center; cursor:pointer; box-shadow:0 6px 15px rgba(0,0,0,.1); }
    .judge-btn:active{ transform:scale(.92); }
    .btn-correct{ background:var(--green); }
    .btn-wrong{ background:var(--red); }

    /* 键盘自适应流式布局 */
    .keypad{ width:100%; max-width:400px; display:flex; flex-wrap:wrap; justify-content:center; gap:8px; flex-shrink:0; }
    .key{ flex: 1 1 calc(33.333% - 8px); min-width:60px; max-width:100px; height:var(--key-h); border:none; border-radius:18px; background:#fff; color:var(--text); font-size:var(--key-font); font-weight:900; box-shadow:0 5px 0 #ddd; cursor:pointer; display:flex; justify-content:center; align-items:center; }
    .key:active{ transform:translateY(2px); box-shadow:0 2px 0 #ddd; }
    .key.clear{ background:var(--red); color:#fff; }
    .key.confirm{ flex: 2 1 calc(66.666% - 8px); max-width:200px; background:var(--green); color:#fff; font-size:18px; letter-spacing:1px; }

    /* 弹窗 */
    .toast{ position:fixed; top:18px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.72); color:#fff; padding:8px 14px; border-radius:20px; font-size:13px; opacity:0; transition:.25s; pointer-events:none; z-index:1000; max-width:82vw; text-align:center; }
    .kaomoji-popup{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(.5); background:rgba(255,255,255,.96); padding:16px 28px; border-radius:26px; box-shadow:0 12px 36px rgba(0,0,0,.18); font-size:clamp(24px,5vw,40px); opacity:0; pointer-events:none; z-index:2000; transition:all .4s cubic-bezier(.175,.885,.32,1.275); white-space:nowrap; display:flex; flex-direction:column; align-items:center; gap:5px; }
    .kaomoji-popup.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }
    .kaomoji-popup.error{ color:var(--red); }
    .combo-text { font-size:16px; color:var(--gold); font-weight:900; text-shadow:1px 1px 0 #fff; }

    /* 媒体查询适配 */
    @media (max-width:360px), (max-height:680px){
      :root{ --card-w:100px; --card-h:124px; --card-font:58px; --math-card-h:82px; --math-font:28px; --voice-size:56px; --judge-w:74px; --judge-h:44px; --judge-font:20px; --key-h:40px; --key-font:20px; --badge-font:11px; --panel-pad:6px; --header-pad:12px 10px; --app-gap:6px; --card-gap:10px; }
      .key.confirm{ font-size:14px; }
      .board-title{ font-size:11px; }
      .checkbox-label{ font-size:13px; }
      #libInfo{ min-height:28px; font-size:11px; }
      .title-badge { top:-10px; font-size:10px; padding:2px 10px; }
    }

    @media (min-width:361px) and (max-width:430px) and (min-height:681px) and (max-height:860px){
      :root{ --card-w:118px; --card-h:148px; --card-font:72px; --math-card-h:100px; --math-font:34px; --voice-size:64px; --judge-w:84px; --judge-h:50px; --judge-font:22px; --key-h:46px; --key-font:22px; }
    }

    @media (min-width:431px) and (min-height:861px){
      :root{ --card-w:145px; --card-h:188px; --card-font:95px; --math-card-h:138px; --math-font:46px; --voice-size:80px; --judge-w:98px; --judge-h:60px; --judge-font:26px; --key-h:56px; --key-font:26px; }
    }

    @media (orientation:landscape){
      :root{ --card-w:100px; --card-h:120px; --card-font:60px; --math-card-h:82px; --math-font:26px; --voice-size:56px; --judge-w:76px; --judge-h:44px; --judge-font:20px; --key-h:42px; --key-font:20px; --badge-font:11px; --panel-pad:6px; --header-pad:12px 10px; --app-gap:6px; --card-gap:10px; }
      .app{ max-width:100%; padding:8px 10px; }
      .keypad{ max-width:600px; }
      .key{ flex: 1 1 calc(16.666% - 8px); min-width:45px; } /* 横屏自动变6列 */
      .key.confirm{ flex: 2 1 calc(33.333% - 8px); font-size:14px; }
      .math-card{ width:min(100%,600px); }
      .checkbox-label{ font-size:13px; }
      #libInfo{ min-height:24px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header-bar">
      <div class="title-badge" id="titleBadge">🌱 学习新手</div>
      <div class="score-board">
        <span class="board-title">总积分</span>
        <span class="board-value" id="scoreDisplay">0.0</span>
      </div>
      <div class="timer-board">
        <span class="board-title">奖励时间</span>
        <span class="board-value" id="timeDisplay">00:00</span>
      </div>
      <div class="timer-controls">
        <button id="playPauseBtn" onclick="toggleTimer()"><i class="fas fa-play"></i></button>
      </div>
    </div>

    <div class="mode-switcher">
      <button class="mode-btn active" id="btnPinyin" onclick="switchMode('pinyin')">拼音模式</button>
      <button class="mode-btn" id="btnMath" onclick="switchMode('math')">数学模式</button>
    </div>

    <!-- 拼音设置 -->
    <div class="settings-panel" id="pinyinSettings">
      <div class="settings-group" id="practiceTypeGroup">
        <label class="checkbox-label"><input type="radio" name="practiceType" value="combo"> 只练拼读</label>
        <label class="checkbox-label"><input type="radio" name="practiceType" value="single"> 只练单读</label>
        <label class="checkbox-label"><input type="radio" name="practiceType" value="mixed" checked> 混合练习</label>
      </div>
      <details>
        <summary>展开选择韵母 (已选 <span id="pinyinCount">6</span> 个)</summary>
        <div class="settings-group" id="finalCheckboxes">
          <div style="width:100%; text-align:center; font-size:12px; color:var(--sub);">单韵母</div>
          <label class="checkbox-label"><input type="checkbox" value="a" checked> a</label>
          <label class="checkbox-label"><input type="checkbox" value="o" checked> o</label>
          <label class="checkbox-label"><input type="checkbox" value="e" checked> e</label>
          <label class="checkbox-label"><input type="checkbox" value="i" checked> i</label>
          <label class="checkbox-label"><input type="checkbox" value="u" checked> u</label>
          <label class="checkbox-label"><input type="checkbox" value="v" checked> ü</label>
          <div style="width:100%; text-align:center; font-size:12px; color:var(--sub); margin-top:4px;">复韵母</div>
          <label class="checkbox-label"><input type="checkbox" value="ai"> ai</label>
          <label class="checkbox-label"><input type="checkbox" value="ei"> ei</label>
          <label class="checkbox-label"><input type="checkbox" value="ui"> ui</label>
          <label class="checkbox-label"><input type="checkbox" value="ao"> ao</label>
          <label class="checkbox-label"><input type="checkbox" value="ou"> ou</label>
          <label class="checkbox-label"><input type="checkbox" value="iu"> iu</label>
          <label class="checkbox-label"><input type="checkbox" value="ie"> ie</label>
          <label class="checkbox-label"><input type="checkbox" value="ve"> üe</label>
          <label class="checkbox-label"><input type="checkbox" value="er"> er</label>
          <div style="width:100%; text-align:center; font-size:12px; color:var(--sub); margin-top:4px;">鼻韵母</div>
          <label class="checkbox-label"><input type="checkbox" value="an"> an</label>
          <label class="checkbox-label"><input type="checkbox" value="en"> en</label>
          <label class="checkbox-label"><input type="checkbox" value="in"> in</label>
          <label class="checkbox-label"><input type="checkbox" value="un"> un</label>
          <label class="checkbox-label"><input type="checkbox" value="vn"> ün</label>
          <label class="checkbox-label"><input type="checkbox" value="ang"> ang</label>
          <label class="checkbox-label"><input type="checkbox" value="eng"> eng</label>
          <label class="checkbox-label"><input type="checkbox" value="ing"> ing</label>
          <label class="checkbox-label"><input type="checkbox" value="ong"> ong</label>
        </div>
      </details>
    </div>

    <!-- 数学设置 -->
    <div class="settings-panel" id="mathSettings" style="display:none;">
      <div class="settings-group">
        <label class="checkbox-label"><input type="checkbox" class="math-op" value="+" checked> 加</label>
        <label class="checkbox-label"><input type="checkbox" class="math-op" value="-" checked> 减</label>
        <label class="checkbox-label"><input type="checkbox" class="math-op" value="*"> 乘</label>
        <label class="checkbox-label"><input type="checkbox" class="math-op" value="/"> 除</label>
      </div>
      <div class="settings-group">
        <label class="checkbox-label"><input type="checkbox" class="math-digit" value="1" checked> 1位数</label>
        <label class="checkbox-label"><input type="checkbox" class="math-digit" value="2"> 2位数</label>
        <label class="checkbox-label"><input type="checkbox" class="math-digit" value="3"> 3位数</label>
      </div>
    </div>

    <div class="display-container">
      <div id="libInfo">剩余: 0</div>

      <div class="main-card-area">
        <div class="difficulty-badge" id="diffBadge">难度 1 分</div>

        <div id="pinyinCards">
          <div class="pinyin-card" id="cardInitial" onclick="speakCurrentQuestion()">b</div>
          <div class="pinyin-card" id="cardFinal" onclick="speakCurrentQuestion()">ǎ</div>
        </div>

        <div id="mathCard" class="math-card" style="display:none;">
          <div class="math-formula" id="mathFormula">
            <span id="mathText">12 + 5 =</span>
            <span class="math-answer-box" id="mathAnswerDisplay"></span>
          </div>
        </div>
      </div>

      <div id="pinyinActionArea">
        <div class="pinyin-tool-row">
          <button class="speak-btn" id="speakBtn" onclick="speakCurrentQuestion()"><i class="fas fa-volume-high"></i></button>
          <button class="voice-btn" id="voiceBtn"><i class="fas fa-microphone"></i></button>
        </div>
        <div class="judge-btns">
          <button class="judge-btn btn-wrong" onclick="judge(false)"><i class="fas fa-times"></i></button>
          <button class="judge-btn btn-correct" onclick="judge(true)"><i class="fas fa-check"></i></button>
        </div>
      </div>

      <div id="mathInputArea" style="display:none;">
        <div class="keypad">
          <button class="key" onclick="pressKey('1')">1</button>
          <button class="key" onclick="pressKey('2')">2</button>
          <button class="key" onclick="pressKey('3')">3</button>
          <button class="key" onclick="pressKey('4')">4</button>
          <button class="key" onclick="pressKey('5')">5</button>
          <button class="key" onclick="pressKey('6')">6</button>
          <button class="key" onclick="pressKey('7')">7</button>
          <button class="key" onclick="pressKey('8')">8</button>
          <button class="key" onclick="pressKey('9')">9</button>
          <button class="key clear" onclick="pressKey('C')">C</button>
          <button class="key" onclick="pressKey('0')">0</button>
          <button class="key confirm" onclick="pressKey('OK')">确定</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">提示</div>
  <div class="kaomoji-popup" id="kaomojiPopup">
    <div id="kaomojiFace"></div>
    <div class="combo-text" id="comboText" style="display:none;"></div>
  </div>

  <script>
    // --- 拼音数据扩充 ---
    const initialMap = {
      'a':['b','p','m','f','d','t','n','l','g','k','h','zh','ch','sh','z','c','s','y','w'],
      'o':['b','p','m','f','y','w'],
      'e':['m','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','y'],
      'i':['b','p','m','d','t','n','l','j','q','x','zh','ch','sh','r','z','c','s','y'],
      'u':['b','p','m','f','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','w'],
      'v':['n','l','j','q','x','y'],
      'ai':['b','p','m','d','t','n','l','g','k','h','zh','ch','sh','z','c','s','w'],
      'ei':['b','p','m','f','d','t','n','l','g','k','h','zh','sh','z','c','s','w'],
      'ui':['d','t','g','k','h','zh','ch','sh','r','z','c','s'],
      'ao':['b','p','m','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','y'],
      'ou':['p','m','f','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','y'],
      'iu':['d','t','n','l','j','q','x'],
      'ie':['p','m','d','t','n','l','j','q','x','y'],
      've':['n','l','j','q','x','y'],
      'er':[],
      'an':['b','p','m','f','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','y','w'],
      'en':['b','p','m','f','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','w'],
      'in':['p','m','n','l','j','q','x','y'],
      'un':['d','t','l','g','k','h','zh','ch','sh','r','z','c','s'],
      'vn':['j','q','x','y'],
      'ang':['b','p','m','f','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','y','w'],
      'eng':['b','p','m','f','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','w'],
      'ing':['p','m','d','t','n','l','j','q','x','y'],
      'ong':['m','d','t','n','l','g','k','h','zh','ch','sh','r','z','c','s','y','w']
    };

    const toneMap = {
      'a':['ā','á','ǎ','à'], 'o':['ō','ó','ǒ','ò'], 'e':['ē','é','ě','è'], 'i':['ī','í','ǐ','ì'], 'u':['ū','ú','ǔ','ù'], 'v':['ǖ','ǘ','ǚ','ǜ'],
      'ai':['āi','ái','ǎi','ài'], 'ei':['ēi','éi','ěi','èi'], 'ui':['uī','uí','uǐ','uì'], 'ao':['āo','áo','ǎo','ào'], 'ou':['ōu','óu','ǒu','òu'],
      'iu':['iū','iú','iǔ','iù'], 'ie':['iē','ié','iě','iè'], 've':['üē','üé','üě','üè'], 'er':['ēr','ér','ěr','èr'],
      'an':['ān','án','ǎn','àn'], 'en':['ēn','én','ěn','èn'], 'in':['īn','ín','ǐn','ìn'], 'un':['ūn','ún','ǔn','ùn'], 'vn':['ǖn','ǘn','ǚn','ǜn'],
      'ang':['āng','áng','ǎng','àng'], 'eng':['ēng','éng','ěng','èng'], 'ing':['īng','íng','ǐng','ìng'], 'ong':['ōng','óng','ǒng','òng']
    };

    const initialSpeakMap = { 'b':'玻','p':'坡','m':'摸','f':'佛','d':'得','t':'特','n':'讷','l':'勒','g':'哥','k':'科','h':'喝','j':'鸡','q':'七','x':'西','zh':'知','ch':'吃','sh':'诗','r':'日','z':'资','c':'雌','s':'思','y':'衣','w':'乌' };
    const finalSpeakMap = { 'a':'啊','o':'喔','e':'鹅','i':'衣','u':'乌','ü':'迂','ai':'哀','ei':'诶','ui':'威','ao':'熬','ou':'欧','iu':'优','ie':'耶','ve':'约','er':'儿','an':'安','en':'恩','in':'因','un':'温','vn':'晕','ang':'昂','eng':'鞥','ing':'英','ong':'翁' };

    const singleInitials = ['b','p','m','f','d','t','n','l','g','k','h','j','q','x','zh','ch','sh','r','z','c','s','y','w'];
    const successKaomojis = ['ദ്ദി˶ｰ̀֊ｰ́ )✧','ദ്ദി˶•̀֊•́)✧','ദ്ദി˶˃ ᵕ ˂ )✧','(๑•̀ㅂ•́)و✧','(≧∇≦)ﾉ'];
    const errorKaomojis = ['૮₍ ˶•‸•˶₎ა','´ᯅ`','(っ˘̩╭╮˘̩)っ','(；′⌒`)','(。_。)'];

    let currentMode = 'pinyin';
    let pinyinPool = [];
    let currentQuestion = null;
    let mathInput = '';

    let score = parseFloat(localStorage.getItem('pinyin_score')) || 0;
    let timeLeft = parseInt(localStorage.getItem('pinyin_time')) || 0;
    let comboCount = 0; // 连击数

    let timerInterval = null;
    let isTimerRunning = false;

    // --- 本地存储设置 ---
    function saveSettings() {
      const pinyinFinals = Array.from(document.querySelectorAll('#finalCheckboxes input:checked')).map(i=>i.value);
      const practiceType = document.querySelector('input[name="practiceType"]:checked').value;
      const mathOps = Array.from(document.querySelectorAll('.math-op:checked')).map(i=>i.value);
      const mathDigits = Array.from(document.querySelectorAll('.math-digit:checked')).map(i=>i.value);

      localStorage.setItem('setting_pinyinFinals', JSON.stringify(pinyinFinals));
      localStorage.setItem('setting_practiceType', practiceType);
      localStorage.setItem('setting_mathOps', JSON.stringify(mathOps));
      localStorage.setItem('setting_mathDigits', JSON.stringify(mathDigits));
    }

    function loadSettings() {
      try {
        const pinyinFinals = JSON.parse(localStorage.getItem('setting_pinyinFinals'));
        if(pinyinFinals && pinyinFinals.length > 0) {
          document.querySelectorAll('#finalCheckboxes input').forEach(el => el.checked = pinyinFinals.includes(el.value));
        }
        const practiceType = localStorage.getItem('setting_practiceType');
        if(practiceType) {
          document.querySelector(`input[name="practiceType"][value="${practiceType}"]`).checked = true;
        }
        const mathOps = JSON.parse(localStorage.getItem('setting_mathOps'));
        if(mathOps && mathOps.length > 0) {
          document.querySelectorAll('.math-op').forEach(el => el.checked = mathOps.includes(el.value));
        }
        const mathDigits = JSON.parse(localStorage.getItem('setting_mathDigits'));
        if(mathDigits && mathDigits.length > 0) {
          document.querySelectorAll('.math-digit').forEach(el => el.checked = mathDigits.includes(el.value));
        }
      } catch(e) {}
      updatePinyinCount();
    }

    function updatePinyinCount() {
      const count = document.querySelectorAll('#finalCheckboxes input:checked').length;
      document.getElementById('pinyinCount').innerText = count;
    }

    function saveData(){
      localStorage.setItem('pinyin_score', score.toFixed(1));
      localStorage.setItem('pinyin_time', timeLeft);
    }

    function showToast(text){
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.style.opacity = '1';
      setTimeout(()=>toast.style.opacity='0', 1800);
    }

    function showKaomoji(isSuccess, bonus = 0){
      const popup = document.getElementById('kaomojiPopup');
      const face = document.getElementById('kaomojiFace');
      const comboText = document.getElementById('comboText');

      const arr = isSuccess ? successKaomojis : errorKaomojis;
      face.innerText = arr[Math.floor(Math.random() * arr.length)];

      if(isSuccess && comboCount >= 3) {
        comboText.style.display = 'block';
        comboText.innerText = `连击 x${comboCount}！额外 +${bonus}分`;
      } else {
        comboText.style.display = 'none';
      }

      popup.className = 'kaomoji-popup show' + (isSuccess ? '' : ' error');
      setTimeout(()=>popup.classList.remove('show'), 1500);
    }

    function createConfetti(){
      const colors = ['#FFB6C1','#87CEFA','#98FB98','#FFD700','#DDA0DD'];
      for(let i=0;i<30;i++){
        const c = document.createElement('div');
        c.style.position = 'fixed'; c.style.width = '10px'; c.style.height = '10px';
        c.style.left = Math.random() * 100 + 'vw'; c.style.top = '38vh';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.zIndex = '999'; c.style.pointerEvents = 'none';
        document.body.appendChild(c);
        const tx = (Math.random() - 0.5) * 300; const ty = Math.random() * 250 + 100;
        c.animate([ { transform:'translate(0,0) rotate(0deg) scale(1)', opacity:1 }, { transform:`translate(${tx}px,${ty}px) rotate(360deg) scale(0)`, opacity:0 } ], { duration:1200, easing:'ease-out' });
        setTimeout(()=>c.remove(), 1250);
      }
    }

    function getTitle(s) {
      if(s < 20) return "🌱 学习新手";
      if(s < 60) return "⭐ 聪明宝贝";
      if(s < 150) return "🔥 答题小能手";
      if(s < 300) return "👑 智慧小达人";
      return "🏆 学习大魔王";
    }

    function updateDisplay(){
      const scoreDisplay = document.getElementById('scoreDisplay');
      const timeDisplay = document.getElementById('timeDisplay');
      const titleBadge = document.getElementById('titleBadge');

      scoreDisplay.innerText = Number(score).toFixed(1);
      scoreDisplay.style.color = score < 0 ? 'var(--red)' : 'var(--blue)';

      titleBadge.innerText = getTitle(score);

      const isNegative = timeLeft < 0;
      const abs = Math.abs(timeLeft);
      const mm = String(Math.floor(abs / 60)).padStart(2, '0');
      const ss = String(abs % 60).padStart(2, '0');
      timeDisplay.innerText = `${isNegative ? '-' : ''}${mm}:${ss}`;
      timeDisplay.style.color = isNegative ? 'var(--red)' : 'var(--blue)';
    }

    function getRandomDifficulty(){
      const rand = Math.random();
      if (rand < 0.9) return 1;
      if (rand < 0.99) return 2;
      return 3;
    }

    function switchMode(mode){
      currentMode = mode;
      document.getElementById('btnPinyin').classList.toggle('active', mode === 'pinyin');
      document.getElementById('btnMath').classList.toggle('active', mode === 'math');
      document.getElementById('pinyinSettings').style.display = mode === 'pinyin' ? 'block' : 'none';
      document.getElementById('mathSettings').style.display = mode === 'math' ? 'block' : 'none';
      document.getElementById('pinyinCards').style.display = mode === 'pinyin' ? 'flex' : 'none';
      document.getElementById('mathCard').style.display = mode === 'math' ? 'flex' : 'none';
      document.getElementById('pinyinActionArea').style.display = mode === 'pinyin' ? 'flex' : 'none';
      document.getElementById('mathInputArea').style.display = mode === 'math' ? 'flex' : 'none';
      loadNext();
    }

    function shuffleArray(arr){
      for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function generatePinyinLibrary(){
      const finals = Array.from(document.querySelectorAll('#finalCheckboxes input:checked')).map(i=>i.value);
      const practiceType = document.querySelector('input[name="practiceType"]:checked').value;

      if(finals.length === 0){
        document.querySelector('#finalCheckboxes input[value="a"]').checked = true;
        finals.push('a');
        updatePinyinCount();
      }

      let pool = [];

      if(practiceType === 'combo' || practiceType === 'mixed'){
        finals.forEach(f=>{
          if(initialMap[f]) {
            initialMap[f].forEach(initial=>{
              toneMap[f].forEach(final=>{
                pool.push({ type:'combo', label:'拼读题', initial, final });
              });
            });
          }
        });
      }

      if(practiceType === 'single' || practiceType === 'mixed'){
        singleInitials.forEach(item=>{
          pool.push({ type:'single', singleType:'initial', label:'声母单读', value:item });
        });
        finals.forEach(f=>{
          const finalDisplay = (f === 'v' || f === 've') ? f.replace('v','ü') : f;
          pool.push({ type:'single', singleType:'final', label:'韵母单读', value:finalDisplay });
        });
      }

      return shuffleArray(pool);
    }

    function getMaxByDigits(maxDigit){
      if(maxDigit === 1) return 9;
      if(maxDigit === 2) return 99;
      return 999;
    }

    function generateMathQuestion(){
      const ops = Array.from(document.querySelectorAll('.math-op:checked')).map(i=>i.value);
      const digits = Array.from(document.querySelectorAll('.math-digit:checked')).map(i=>parseInt(i.value));

      if(ops.length === 0 || digits.length === 0){
        return { text:'请勾选选项', answer:0 };
      }

      const op = ops[Math.floor(Math.random()*ops.length)];
      const maxDigit = Math.max(...digits);
      const maxNum = getMaxByDigits(maxDigit);

      let a = Math.floor(Math.random() * (maxNum + 1));
      let b = Math.floor(Math.random() * (maxNum + 1));

      if(op === '-'){ if(a < b) [a,b] = [b,a]; }
      if(op === '/'){
        const divisorMax = Math.min(maxNum === 9 ? 9 : (maxNum === 99 ? 12 : 20), maxNum || 1);
        const divisor = Math.max(1, Math.floor(Math.random() * divisorMax) + 1);
        const answer = Math.floor(Math.random() * (Math.floor(maxNum / Math.max(1, divisor)) + 1));
        const dividend = divisor * answer;
        return { text: `${dividend} ÷ ${divisor} =`, answer };
      }

      let answer = 0;
      if(op === '+') answer = a + b;
      if(op === '-') answer = a - b;
      if(op === '*') answer = a * b;

      const opText = op === '*' ? '×' : op;
      return { text: `${a} ${opText} ${b} =`, answer };
    }

    function applyDifficultyStyle(targets, diff){
      targets.forEach(el=>{
        el.classList.remove('diff-1','diff-2','diff-3');
        el.classList.add(`diff-${diff}`);
      });
    }

    function renderPinyinQuestion(question, difficulty){
      const cardInitial = document.getElementById('cardInitial');
      const cardFinal = document.getElementById('cardFinal');

      cardInitial.className = 'pinyin-card';
      cardFinal.className = 'pinyin-card';

      if(question.type === 'combo'){
        cardInitial.classList.remove('hidden','single');
        cardFinal.classList.remove('hidden','single');
        cardInitial.innerText = question.initial;
        cardFinal.innerText = question.final;
        applyDifficultyStyle([cardInitial, cardFinal], difficulty);
      }else{
        cardInitial.classList.remove('hidden');
        cardFinal.classList.add('hidden');
        cardInitial.classList.add('single');
        cardInitial.innerText = question.value;
        applyDifficultyStyle([cardInitial], difficulty);
      }
    }

    function loadNext(){
      const difficulty = getRandomDifficulty();
      document.getElementById('diffBadge').innerText = `难度 ${difficulty} 分`;

      if(currentMode === 'pinyin'){
        if(pinyinPool.length === 0) pinyinPool = generatePinyinLibrary();
        currentQuestion = pinyinPool.pop();
        currentQuestion.difficulty = difficulty;

        let scoreInfo = currentQuestion.type === 'single' ? ' · 计10%分值' : '';
        document.getElementById('libInfo').innerText = `${currentQuestion.label}｜拼音库剩余: ${pinyinPool.length}${scoreInfo}`;
        renderPinyinQuestion(currentQuestion, difficulty);
      }else{
        currentQuestion = generateMathQuestion();
        currentQuestion.difficulty = difficulty;
        mathInput = '';
        document.getElementById('mathText').innerText = currentQuestion.text;
        document.getElementById('mathAnswerDisplay').innerText = '';
        document.getElementById('libInfo').innerText = '数学挑战中...';
        applyDifficultyStyle([document.getElementById('mathCard')], difficulty);
      }
    }

    function pressKey(key){
      if(currentMode !== 'math') return;
      if(key === 'C'){
        mathInput = '';
      }else if(key === 'OK'){
        if(mathInput === '') return;
        judge(parseInt(mathInput,10) === currentQuestion.answer);
        return;
      }else{
        if(mathInput.length < 8) mathInput += key;
      }
      document.getElementById('mathAnswerDisplay').innerText = mathInput;
    }

    function getQuestionReward(baseDifficulty){
      if(currentMode === 'pinyin' && currentQuestion && currentQuestion.type === 'single'){
        return { scoreDelta: Number((baseDifficulty * 0.1).toFixed(1)), timeDelta: Math.round(baseDifficulty * 6) };
      }
      return { scoreDelta: baseDifficulty, timeDelta: baseDifficulty * 60 };
    }

    function judge(isCorrect){
      const basePts = currentQuestion.difficulty;
      const reward = getQuestionReward(basePts);

      if(isCorrect){
        comboCount++;
        let bonus = 0;
        if(comboCount >= 3) {
          bonus = Number((Math.floor(comboCount / 3) * 0.5).toFixed(1)); // 每3连击额外0.5分
        }
        score = Number((score + reward.scoreDelta + bonus).toFixed(1));
        timeLeft += reward.timeDelta + (bonus * 60);
        showKaomoji(true, bonus);
        createConfetti();
      }else{
        comboCount = 0; // 断连
        score = Number((score - reward.scoreDelta).toFixed(1));
        timeLeft -= reward.timeDelta;
        showKaomoji(false);
      }

      saveData();
      updateDisplay();
      setTimeout(loadNext, 600);
    }

    function toggleTimer(){
      const icon = document.querySelector('#playPauseBtn i');
      if(isTimerRunning){
        clearInterval(timerInterval); isTimerRunning = false; icon.className = 'fas fa-play'; saveData(); return;
      }
      if(timeLeft < 0){ showToast('倒欠时间啦，先继续学习哦'); return; }
      if(timeLeft === 0){ showToast('当前没有奖励时间哦'); return; }

      isTimerRunning = true; icon.className = 'fas fa-pause';
      timerInterval = setInterval(()=>{
        timeLeft--;
        if(timeLeft <= 0){ timeLeft = 0; score = 0; comboCount = 0; clearInterval(timerInterval); isTimerRunning = false; icon.className = 'fas fa-play'; showToast('时间到，积分已清空'); }
        saveData(); updateDisplay();
      },1000);
    }

    function markSpeakButtonPlaying(){
      const btn = document.getElementById('speakBtn');
      btn.classList.add('playing');
      setTimeout(()=>btn.classList.remove('playing'), 1200);
    }

    function getSpeakText(){
      if(!currentQuestion) return '';
      if(currentQuestion.type === 'single'){
        let val = currentQuestion.value.replace('ü','v');
        if(currentQuestion.singleType === 'initial') return initialSpeakMap[val] || val;
        // 去掉声调找基础发音
        let baseFinal = val.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        return finalSpeakMap[baseFinal] || val;
      }
      const initial = currentQuestion.initial;
      const final = currentQuestion.final;
      const baseFinal = final.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace('ü','v');
      const initialSpeak = initialSpeakMap[initial] || initial;
      const finalSpeak = finalSpeakMap[baseFinal] || final;
      return `${initialSpeak}，${finalSpeak}，${initial}${final}`;
    }

    function speakCurrentQuestion(){
      if(currentMode !== 'pinyin' || !currentQuestion) return;
      if(!('speechSynthesis' in window)) { showToast('当前浏览器不支持自动朗读'); return; }
      window.speechSynthesis.cancel();
      const text = getSpeakText();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-CN'; utter.rate = currentQuestion.type === 'single' ? 0.68 : 0.62; utter.pitch = 1.0; utter.volume = 1;
      const voices = speechSynthesis.getVoices();
      const zhVoice = voices.find(v => v.lang && (v.lang.toLowerCase().includes('zh') || v.lang.toLowerCase().includes('cmn')));
      if(zhVoice) utter.voice = zhVoice;
      utter.onstart = () => markSpeakButtonPlaying();
      speechSynthesis.speak(utter);
    }

    function setupVoice(){
      const btn = document.getElementById('voiceBtn');
      if(!('webkitSpeechRecognition' in window)) return;
      const rec = new webkitSpeechRecognition();
      rec.lang = 'zh-CN'; rec.continuous = false; rec.interimResults = false;
      let isRecognizing = false; let pressTime = 0;
      rec.onstart = ()=>{ isRecognizing = true; };
      rec.onresult = (e)=>{ if(e.results[0][0].transcript.trim()) judge(true); };
      rec.onend = ()=>{ isRecognizing = false; btn.classList.remove('recording'); };
      const start = (e)=>{ if(currentMode !== 'pinyin') return; e.preventDefault(); pressTime = Date.now(); btn.classList.add('recording'); try{ rec.start(); }catch(err){} };
      const stop = (e)=>{ if(currentMode !== 'pinyin') return; e.preventDefault(); btn.classList.remove('recording'); if(Date.now() - pressTime < 350){ try{ rec.stop(); }catch(err){} showToast('按住时间太短啦'); return; } if(isRecognizing){ try{ rec.stop(); }catch(err){} } };
      btn.addEventListener('mousedown', start); btn.addEventListener('touchstart', start, { passive:false });
      btn.addEventListener('mouseup', stop); btn.addEventListener('mouseleave', stop); btn.addEventListener('touchend', stop, { passive:false }); btn.addEventListener('touchcancel', stop, { passive:false });
    }

    // 监听设置变化并保存
    document.querySelectorAll('#finalCheckboxes input').forEach(el=>{
      el.addEventListener('change', ()=>{ updatePinyinCount(); saveSettings(); pinyinPool = []; if(currentMode === 'pinyin') loadNext(); });
    });
    document.querySelectorAll('input[name="practiceType"]').forEach(el=>{
      el.addEventListener('change', ()=>{ saveSettings(); pinyinPool = []; if(currentMode === 'pinyin') loadNext(); });
    });
    document.querySelectorAll('.math-op, .math-digit').forEach(el=>{
      el.addEventListener('change', ()=>{ saveSettings(); if(currentMode === 'math') loadNext(); });
    });

    if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); }

    // 初始化
    loadSettings();
    updateDisplay();
    setupVoice();
    switchMode('pinyin');
  </script>
</body>
</html>
